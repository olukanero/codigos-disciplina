/* ---------- As regras do resultado (seção 9 da copy) ---------- */
function calcular(escolhas, frase) {
  const somas = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };
  let estrutura = 0;
  for (const b of escolhas) { if (b === "R") estrutura++; else somas[b]++; }
  const ordem = LETRAS.slice().sort((x, y) => somas[y] - somas[x]);
  const topo = somas[ordem[0]];
  const empatados = ordem.filter((b) => somas[b] === topo);
  let primario, empate = null;
  if (topo <= 1 || estrutura > topo) primario = "R";                                   // 1. nada se destacou
  else if (topo - somas[ordem[1]] >= 2) primario = ordem[0];                           // 2. destaque claro
  else if (frase !== "X" && somas[frase] >= 2 && somas[frase] >= topo - 1) primario = frase; // 3. a frase decide
  else if (empatados.length > 1) { primario = empatados[0]; empate = empatados.slice(0, 3); } // 4. empate exato
  else primario = ordem[0];
  const resto = ordem.filter((b) => b !== primario);
  const segundo = primario === "R" ? ordem[0] : (somas[resto[0]] >= 2 ? resto[0] : "R"); // 5. o segundo
  return { somas, ordem, estrutura, primario, segundo, empate };
}

let salvas = [];

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
function carregar() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); return Array.isArray(s) ? s : []; } catch (e) { return []; } }
function salvar() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(salvas)); } catch (e) {} }
function escapar(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) { return escapar(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function renderizar(texto) {
  let html = "", lista = false, par = [];
  const fp = () => { if (par.length) { html += "<p>" + par.map(inline).join("<br>") + "</p>"; par = []; } };
  const fl = () => { if (lista) { html += "</ul>"; lista = false; } };
  for (const bruta of texto.split("\n")) {
    const l = bruta.trim(); let m;
    if (!l) { fp(); fl(); continue; }
    if ((m = l.match(/^###\s+(.*)$/))) { fp(); fl(); html += "<h3>" + inline(m[1]) + "</h3>"; continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { fp(); fl(); html += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    if ((m = l.match(/^[-*]\s+(.*)$/))) { fp(); if (!lista) { html += "<ul>"; lista = true; } html += "<li><span>" + inline(m[1]) + "</span></li>"; continue; }
    fl(); par.push(l);
  }
  fp(); fl();
  return html;
}
function limpar(s, max) { return s.replace(/[\r\n]+/g, " ").replace(/[*#>\[\]]/g, "").replace(/\s+/g, " ").trim().slice(0, max); }
function rolar() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }

function adicionar(quem, html, extra) {
  const w = document.createElement("div");
  const primeira = quem !== ultimo;
  w.className = "msg " + quem + (primeira ? " first" : "") + (extra ? " " + extra : "");
  if (quem === "luka" && !extra) {
    const slot = document.createElement("div"); slot.className = "slot";
    if (primeira) { const a = document.createElement("div"); a.className = "avatar s"; a.textContent = "L"; a.setAttribute("aria-hidden", "true"); pintarAvatar(a); slot.appendChild(a); }
    w.appendChild(slot);
  }
  if (extra) w.innerHTML = html;
  else { const b = document.createElement("div"); b.className = "bubble"; b.innerHTML = html; w.appendChild(b); }
  chat.appendChild(w); ultimo = quem; rolar();
  return w;
}

}

  adicionar("user", escapar(rotulo));

function botoes(opcoes, grade) {
  if (replay.length) {
    const v = replay.shift();
    const op = opcoes.find((o) => o.valor === v);
    if (op) { adicionar("user", escapar(op.label)); salvas.push(v); return Promise.resolve(v); }
    replay = [];
  }
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "options" + (grade ? " grid2" : "");
    box.setAttribute("role", "group"); box.setAttribute("aria-label", "Respostas");
    opcoes.forEach((op, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "option"; b.textContent = op.label;
      b.style.animationDelay = (i * 40) + "ms";
      b.addEventListener("click", () => resolve(responder(op.valor, op.label)));
      box.appendChild(b);
    });
    answers.innerHTML = ""; answers.appendChild(box); rolar();
  });
}

function texto(placeholder, max) {
  if (replay.length) {
    const v = replay.shift();
    if (typeof v === "string" && v) { adicionar("user", escapar(v)); salvas.push(v); return Promise.resolve(v); }
    replay = [];
  }
  return new Promise((resolve) => {
    const form = document.createElement("form"); form.className = "field"; form.autocomplete = "off";
    form.innerHTML = '<textarea rows="1" maxlength="' + max + '" aria-label="Sua resposta"></textarea><button class="send" type="submit" aria-label="Enviar" disabled><span class="ms">arrow_upward</span></button>';
    const campo = form.querySelector("textarea"), enviar = form.querySelector(".send");
    campo.placeholder = placeholder;
    campo.addEventListener("input", () => { campo.style.height = "auto"; campo.style.height = Math.min(campo.scrollHeight, 120) + "px"; enviar.disabled = !campo.value.trim(); });
    campo.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(hover: hover)").matches) { e.preventDefault(); form.requestSubmit(); } });
    form.addEventListener("submit", (e) => { e.preventDefault(); const v = limpar(campo.value, max); if (v) resolve(responder(v, v)); });
    answers.innerHTML = ""; answers.appendChild(form); rolar();
    if (matchMedia("(hover: hover)").matches) campo.focus();
  });
}

function email() {
  if (replay.length) {
    const v = replay.shift();
    if (typeof v === "string" && v.includes("@")) { adicionar("user", escapar(v)); salvas.push(v); return Promise.resolve({ valor: v, novo: false }); }
    replay = [];
  }
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.innerHTML = '<form class="field" novalidate><input type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="seuemail@exemplo.com" aria-label="Seu e-mail" aria-describedby="emailHint"><button class="send" type="submit" aria-label="Enviar" disabled><span class="ms">arrow_upward</span></button></form>' +
      '<p class="hint" id="emailHint">Ao enviar, você aceita receber mensagens do Luka. Dá pra sair quando quiser. Veja a <a href="' + LINK_PRIVACIDADE + '" target="_blank" rel="noopener">política de privacidade</a>.</p>';
    const form = wrap.querySelector("form"), campo = form.querySelector("input"), enviar = form.querySelector(".send"), hint = wrap.querySelector(".hint");
    const original = hint.innerHTML;
    campo.addEventListener("input", () => { enviar.disabled = !campo.value.trim(); form.classList.remove("error"); hint.classList.remove("err"); hint.innerHTML = original; });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = campo.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
        form.classList.add("error"); hint.classList.add("err"); hint.textContent = "Acho que faltou alguma coisa nesse e-mail. Confere pra mim?";
        campo.setAttribute("aria-invalid", "true"); campo.focus(); return;

      resolve({ valor: responder(v, v), novo: true });
    });
    answers.innerHTML = ""; answers.appendChild(wrap); rolar();
    if (matchMedia("(hover: hover)").matches) campo.focus();
  });
}

    '<div class="stroke"></div><h2 class="name">' + escapar(s.nome.replace(/^O /, '')) + '</h2>' +
    '<p class="lie">' + escapar(s.mentira) + '</p></div>' +
    '<div class="light lk-light"><div class="metas"><div><b>' + escapar(s.chave.replace(/^\d+\s*·\s*/, '')) + '</b>Código-chave</div><div><b>' + escapar(s.rota) + '</b>Rota</div><div><b>' + escapar(s.vira.replace(/^O /, '')) + '</b>' + (s.estrutura ? "Rodando, vira" : "Desarmado, vira") + '</div></div>' +
    '<div class="body"><span class="label">O seu resultado</span>' +
    '<p><b>Hábito:</b> ' + escapar(habito) + '</p>' +
    '<p>' + (s.estrutura ? "A rota é a ordem dos 3 Códigos que montam a sua estrutura, em 8 semanas." : "A rota é a ordem dos 3 Códigos que desarmam o seu Sabotador, em 8 semanas.") + '</p></div>' +
    '<div class="foot"><span>Diagnóstico dos Sabotadores</span><b>@lukanero</b></div></div></article>';
}

/* ---------- O roteiro (seções 4 a 8 da copy) ---------- */
async function conversa() {

  // Situação
  await diz("Aqui é o Luka. Que bom que veio.\n\nVou perguntar das suas últimas semanas, não de quem você gostaria de ser.\n\nPra começar: qual hábito você vem tentando e não consegue sustentar?");
  const habito = await texto("Ex.: treinar, estudar, ler", 60);

  await diz("Fechou. Esse vai ser o nosso hábito daqui pra frente.\n\nQuantas vezes você já começou e largou esse hábito?");
  const vezes = VEZES[await botoes(VEZES.map((o, i) => ({ label: o.label, valor: i })), true)];

  await diz("E quando costuma parar?");
  const parada = PARADA[await botoes(PARADA.map((o, i) => ({ label: o.label, valor: i })), true)];

  // Problema: as cenas
  await diz(PASSAGEM);
  const escolhas = [], vistos = {};
  const hCurto = habitoCurto(habito);
  for (let c = 0; c < CENAS.length; c++) {
    const cena = CENAS[c];
    let p = hCurto && cena.comHabito ? cena.comHabito.replace("{h}", hCurto) : cena.texto;
    if (c === 4) p = "Metade já foi.\n\n" + p;
    else if (c === CENAS.length - 1) p = "Última cena.\n\n" + p;
    await diz(p);
    const i = await botoes(cena.opcoes.map((o, k) => ({ label: o[1], valor: k })));
    const letra = cena.opcoes[i][0];
    escolhas.push(letra);
    vistos[letra] = (vistos[letra] || 0) + 1;
    const vez = vistos[letra];
    await diz(vez === 1 ? cena.opcoes[i][2] : vez <= 3 ? PADRAO[letra][vez - 2] : PADRAO_MAIS);
  }
  const largada = LARGADA[escolhas[0]] || "começa do jeito que dá";

  await diz(CIRCUNSTANCIA);
  const circunstancia = await botoes([{ label: "Sim, tem", valor: 1 }, { label: "Não", valor: 0 }], true);

  await diz("Tô quase fechando. Pensa no momento exato em que você trava.\n\nQual destas mais parece com o que passa na sua cabeça?");
  const frase = await botoes(FRASES.map(([b, t]) => ({ label: t, valor: b })));

  const r = calcular(escolhas, frase);

  // Contato
  await diz("Pronto. Já sei o que te trava.\n\nAntes de te mostrar: qual é o seu melhor e-mail? É por onde eu te mando, de vez em quando, coisa útil sobre hábito.");
  const contato = await email();

  // Implicação: o Sabotador e a confirmação
  let sab = r.primario;
  if (r.empate) {
    await diz("Mais de um padrão apareceu com a mesma força em você. Qual destas frases descreve melhor o que te trava agora?");
    sab = await botoes(r.empate.map((b) => ({ label: SAB[b].mentira, valor: b })));
  }
  const apresentar = async (b, abertura) => {
    const s = SAB[b];
    let t = abertura + "\n\n### " + s.nome + "\n> " + s.mentira + "\n\n" + s.pega;
    if (!s.estrutura) t += " No seu caso, com **" + habito + "**, ele aparece " + parada.txt + ".";
    t += "\n\n**Isso soa como você?**";
    await diz(t);
    return botoes([{ label: "Sim, sou eu", valor: "sim" }, { label: "Mais ou menos", valor: "meio" }, { label: "Não muito", valor: "nao" }]);
  };
  const resp = await apresentar(sab, sab === "R" ? "Deixa eu ser honesto: no seu caso, nenhum Sabotador domina." : "Deixa eu ser honesto: o que te trava tem nome.");
  if (resp !== "sim") {
    const b2 = sab === "R" ? r.ordem[0] : r.segundo;
    if (resp === "meio" && b2 !== sab) {
      await diz("Justo. Às vezes ele divide espaço com outro. O segundo que mais apareceu em você foi " + SAB[b2].nome + ":\n\n> " + SAB[b2].mentira + "\n\nQual dos dois parece mais com você?");
      sab = await botoes([sab, b2].map((b) => ({ label: SAB[b].nome, valor: b })), true);
    } else if (b2 !== sab) {
      const resp2 = await apresentar(b2, "Tudo bem. O segundo padrão que mais apareceu nas suas respostas foi outro.");
      if (resp2 === "nao") {
        await diz("Sem problema. Me diz então: qual destas frases mais parece com o que te trava?");
        sab = await botoes(LETRAS.map((b) => ({ label: SAB[b].mentira, valor: b })).concat([{ label: "Nenhuma delas", valor: "R" }]));
      } else sab = b2;
    }
  }
  const s = SAB[sab];
  if (contato.novo) enviarContato({ email: contato.valor, sabotador: s.nome, segundo: SAB[r.segundo].nome, habito: habito, rota: s.rota, origem: new URLSearchParams(location.search).get("utm_source") || "", data: new Date().toISOString() });

  // O custo
  let t2 = (s.estrutura ? "Agora você sabe por onde começar. E o que tem nome tem conserto." : "Agora ele tem nome. E o que tem nome se desarma.") +
    "\n\n" + s.protege + " " + s.naoE + "\n\n" + s.luka +
    (s.estrutura
      ? "\n\nEnquanto a estrutura não muda, o hábito para no mesmo ponto: " + parada.txt + ". Foi assim " + vezes.foi + "."
      : "\n\nEnquanto ele não for desarmado, ele volta no mesmo ponto: " + parada.txt + ". Foi assim " + vezes.foi + ".");
  await diz(t2);
  if (circunstancia) await diz("E uma coisa importante: você contou que tem algo grande tomando o seu tempo agora. Isso é circunstância, não falha de caráter. Se for o caso, comece ainda menor, ou faça uma pausa com data pra voltar.");
  if (sab === "D") await diz("Uma coisa importante: se a autocrítica vem junto com um desânimo que não passa, vale procurar também um profissional de saúde mental. E se surgirem pensamentos de se machucar, liga pro CVV, no 188. Eles atendem 24 horas.");

  // O resultado, em carta
  adicionar("luka", cartaHTML(s, habito), "wide");

  // Necessidade de solução
  await diz("**Se esse hábito rodasse sozinho, sem depender de motivação, o que mudaria pra você?**");
  const mudaria = await texto("Escreve o que mudaria", 220);

  const oferta = [
    "“" + mudaria + "”. Isso é possível, e não depende de você virar outra pessoa.",
    "Você já tentou " + vezes.curto + ". Vontade não faltou: você " + largada + ".",
    "O que faltou foi um sistema feito " + s.pro + ". Sem ele, toda largada termina no mesmo ponto: " + parada.txt + ".",
    "**Os Códigos da Disciplina** é o meu curso, e ele existe pra isso. Lá você recebe a rota completa " + s.do + " e aplica cada Código no seu hábito, **" + habito + "**.",
    "A gente começa com uma versão mínima de 2 minutos. A cada duas semanas, entra uma camada nova. Em 8 semanas, você monta o sistema que segura esse hábito nos dias sem vontade.",
    "E o que você fez aqui foi a versão simplificada. Logo no começo do curso, você faz o diagnóstico completo, com o seu plano B.",
    "A parte mais difícil você já fez: agora você sabe o que te trava. O próximo passo tá aqui:",
  ];
  for (const p of oferta) await diz(p);
  adicionar("luka", '<a class="btn" href="' + escapar(LINK_PAGINA) + '">' + (s.estrutura ? "Quero montar a minha estrutura" : "Quero desarmar o meu Sabotador") + ' <span class="ms" aria-hidden="true">arrow_forward</span></a>', "cta");
  answers.innerHTML = "";
}

function habitoCurto(h) {
  const t = h.trim().replace(/[.!?]+$/, "");
  if (t.split(/\s+/).length > 4) return null;
  return t === t.toUpperCase() ? t : t.charAt(0).toLowerCase() + t.slice(1);
}

/* Para testar do zero: abra a página com ?novo no fim do endereço. */
if (/[?&]novo\b/.test(location.search)) {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  history.replaceState(null, "", location.pathname);
}
replay = carregar();
conversa().catch((e) => console.error(e));
</script>
