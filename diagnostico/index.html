  R: { nome: "Rota da Estrutura", pro: "pra sua Rota da Estrutura", do: "da Rota da Estrutura", mentira: "Nenhum Sabotador domina.",
       chave: "6 · Ambiente", rota: "6 → 5 → 12", vira: "O Construtor", estrutura: true,
       pega: "Não tem um padrão interno forte te travando. O problema costuma estar na estrutura: um ambiente que não ajuda, nenhum lugar ou sequência fixos, nada que dispare a ação.",
       protege: "Isso é boa notícia: o conserto é mais mecânico, e costuma ser mais rápido.",
       naoE: "Mas não significa que você não precisa de nada. Sem estrutura, o hábito continua dependendo do dia bom." },
};

// Regras do resultado da versão rápida.
// Cada resposta vale 1 ponto pro seu Sabotador (ou pra Rota da Estrutura).
function calcular(escolhas, frase) {
  const somas = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };
  let estrutura = 0;
  for (const b of escolhas) { if (b === "R") estrutura++; else somas[b]++; }
  const ordem = Object.keys(somas).sort((x, y) => somas[y] - somas[x]);
  const topo = somas[ordem[0]];
  const empatados = ordem.filter((b) => somas[b] === topo);
  let primario, empate = null;

  if (topo <= 1 || estrutura > topo) primario = "R";          // nada se destacou
  else if (topo - somas[ordem[1]] >= 2) primario = ordem[0];  // destaque claro
  else if (somas[frase] >= topo - 1 && somas[frase] >= 2) primario = frase; // a frase desempata os próximos
  else if (empatados.length > 1) { primario = empatados[0]; empate = empatados.slice(0, 3); }
  else primario = ordem[0];

  const resto = ordem.filter((b) => b !== primario);
  const planoB = primario === "R" ? null : (somas[resto[0]] >= 2 ? resto[0] : "R");
  return { somas, ordem, estrutura, primario, planoB: planoB || "R", empate };
}

/* ---------- Textos que dependem das respostas ---------- */

const VEZES = [
  { label: "Uma ou duas", curto: "uma ou duas vezes", foi: "nas uma ou duas vezes que você tentou" },
  { label: "De 3 a 5", curto: "de 3 a 5 vezes", foi: "nas 3 a 5 vezes que você tentou" },
  { label: "Mais de 5", curto: "mais de 5 vezes", foi: "nas mais de 5 vezes que você tentou" },
  { label: "Perdi a conta", curto: "tantas vezes que perdeu a conta", foi: "em todas as vezes que você tentou" },
];
// A largada sai da primeira cena.
const LARGADA = { G: "começa com tudo", B: "planeja tudo antes de começar", C: "começa, mesmo sem muita fé", E: "começa assim que sobra um tempo", R: "começa do jeito que dá" };
const PARADA = [
  { label: "Antes de engrenar", txt: "antes mesmo de engrenar" },
  { label: "Na primeira semana", txt: "logo na primeira semana" },
  { label: "Na 2ª ou 3ª semana", txt: "lá pela segunda ou terceira semana" },
  { label: "Depois de um mês", txt: "depois de um mês ou mais" },
];

/* ---------- Motor da conversa ---------- */

const conversaEl = document.getElementById("conversa");
const entradaEl = document.getElementById("entrada");
const barraEl = document.getElementById("barra");
const avatar = document.getElementById("avatar");

if (FOTO_LUKA) {
  const img = new Image();
  img.onload = () => { avatar.style.backgroundImage = "url('" + FOTO_LUKA + "')"; avatar.textContent = ""; };
  img.src = FOTO_LUKA;
}

let salvas = [];   // respostas já dadas, pra continuar de onde parou
let replay = [];   // fila usada ao recarregar a página
let execucao = 0;  // muda a cada Recomeçar, pra cancelar a conversa antiga

function carregar() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); return Array.isArray(s) ? s : []; } catch (e) { return []; } }
function salvar() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(salvas)); } catch (e) {} }

function escapar(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) { return escapar(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function renderizar(texto) {
  let html = "", lista = false, par = [];
  const fp = () => { if (par.length) { html += "<p>" + par.map(inline).join("<br>") + "</p>"; par = []; } };
  const fl = () => { if (lista) { html += "</ul>"; lista = false; } };
  for (const bruta of texto.split("\n")) {
    const l = bruta.trim(); let m;
    if (!l) { fp(); fl(); continue; }
    if (l === "[[BOTAO]]") { fp(); fl(); html += '<a class="botao" href="' + escapar(LINK_PAGINA) + '">Quero conhecer</a>'; continue; }
    if ((m = l.match(/^###\s+(.*)$/))) { fp(); fl(); html += "<h3>" + inline(m[1]) + "</h3>"; continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { fp(); fl(); html += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    if ((m = l.match(/^-\s+(.*)$/))) { fp(); if (!lista) { html += "<ul>"; lista = true; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    fl(); par.push(l);
  }
  fp(); fl();
  return html;
}

// Texto da pessoa entra limpo: sem quebras e sem marcações.
function limpar(s, max) { return s.replace(/[\r\n]+/g, " ").replace(/[*#>\[\]]/g, "").replace(/\s+/g, " ").trim().slice(0, max); }

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
function rolar() { requestAnimationFrame(() => { conversaEl.scrollTop = conversaEl.scrollHeight; }); }
function bolha(quem, html) {
  const w = document.createElement("div"); w.className = "msg " + quem;
  const b = document.createElement("div"); b.className = "bolha"; b.innerHTML = html;
  w.appendChild(b); conversaEl.appendChild(w); rolar();
}
function progresso(p) { if (barraEl) barraEl.style.width = Math.round(p * 100) + "%"; }

class Cancelado extends Error {}

async function diz(texto, id) {
  if (id !== execucao) throw new Cancelado();
  if (!replay.length) {
    const t = document.createElement("div"); t.className = "msg luka digitando";
    t.innerHTML = '<div class="bolha"><span></span><span></span><span></span></div>';
    conversaEl.appendChild(t); rolar();
    await esperar(Math.min(350 + texto.length * 9, 1500));
    t.remove();
    if (id !== execucao) throw new Cancelado();
  }
  bolha("luka", renderizar(texto));
}

function responder(valor, rotulo) {
  bolha("user", escapar(rotulo));
  salvas.push(valor); salvar();
  entradaEl.innerHTML = "";
  return valor;
}

function botoes(opcoes, id, estilo) {
  if (id !== execucao) return Promise.reject(new Cancelado());
  if (replay.length) {
    const v = replay.shift();
    const op = opcoes.find((o) => o.valor === v);
    if (op) { bolha("user", escapar(op.label)); salvas.push(v); return Promise.resolve(v); }
    replay = [];
  }
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "opcoes " + (estilo || "");
    for (const op of opcoes) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = op.label;
      b.addEventListener("click", () => { if (id === execucao) resolve(responder(op.valor, op.label)); });
      box.appendChild(b);
    }
    entradaEl.innerHTML = ""; entradaEl.appendChild(box); rolar();
  });
}

function texto(placeholder, max, id) {
  if (id !== execucao) return Promise.reject(new Cancelado());
  if (replay.length) {
    const v = replay.shift();
    if (typeof v === "string" && v) { bolha("user", escapar(v)); salvas.push(v); return Promise.resolve(v); }
    replay = [];
  }
  return new Promise((resolve) => {
    const form = document.createElement("form"); form.autocomplete = "off";
    form.innerHTML = '<textarea rows="1" maxlength="' + max + '" aria-label="Sua resposta"></textarea>' +
      '<button class="enviar" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>';
    const campo = form.querySelector("textarea"); campo.placeholder = placeholder;
    campo.addEventListener("input", () => { campo.style.height = "auto"; campo.style.height = Math.min(campo.scrollHeight, 120) + "px"; });
    campo.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover)").matches) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = limpar(campo.value, max);
      if (!v || id !== execucao) return;
      resolve(responder(v, v));
    });
    entradaEl.innerHTML = ""; entradaEl.appendChild(form); rolar();
    if (window.matchMedia("(hover: hover)").matches) campo.focus();
  });
}

/* ---------- O roteiro ---------- */

const TOTAL_PASSOS = 3 + CENAS.length + 2; // hábito, vezes, parada, cenas, circunstância, frase

async function conversa(id) {
  const D = (t) => diz(t, id);
  let passo = 0;
  const avancar = () => progresso(++passo / TOTAL_PASSOS);
  progresso(0);

  // Situação
  await D("Fala! Aqui é o Luka.\n\nVamos conversar uns 3 minutos sobre as suas últimas semanas pra descobrir o seu Sabotador.\n\nPra começar: qual hábito você vem tentando e não consegue sustentar?");
  const habito = await texto("Ex.: treinar, estudar, ler", 60, id);
  avancar();

  await D("Boa. Vou ter isso em mente o tempo todo.\n\nQuantas vezes você já começou e largou esse hábito?");
  const vezes = VEZES[await botoes(VEZES.map((o, i) => ({ label: o.label, valor: i })), id, "escala")];
  avancar();

  await D("E quando costuma parar?");
  const parada = PARADA[await botoes(PARADA.map((o, i) => ({ label: o.label, valor: i })), id, "escala")];
  avancar();

  // Problema: as cenas
  await D("Agora umas cenas rápidas. Pensa no que acontece de verdade, não no que você gostaria que acontecesse.");
  const escolhas = [];
  const vistos = {};
  const hCurto = habitoCurto(habito);
  for (let n = 0; n < CENAS.length; n++) {
    const cena = CENAS[n];
    let pergunta = hCurto && cena.comHabito ? cena.comHabito.replace("{h}", hCurto) : cena.texto;
    if (n === 4) pergunta = "Metade já foi.\n\n" + pergunta;
    else if (n === CENAS.length - 1) pergunta = "Última cena.\n\n" + pergunta;
    await D(pergunta);
    const i = await botoes(cena.opcoes.map((o, k) => ({ label: o[1], valor: k })), id, "empilhado");
    const bloco = cena.opcoes[i][0];
    escolhas.push(bloco);
    vistos[bloco] = (vistos[bloco] || 0) + 1;
    avancar();
    const vez = vistos[bloco];
    await D(vez === 1 ? cena.opcoes[i][2] : vez <= 3 ? PADRAO[bloco][vez - 2] : PADRAO_MAIS);
  }
  const largada = LARGADA[escolhas[0]] || "começa do jeito que dá";

  await D("Tem alguma coisa grande agora tirando quase todo o seu tempo ou a sua energia? Um bebê, dois empregos, uma doença, uma mudança?");
  const circunstancia = await botoes([{ label: "Sim, tem", valor: 1 }, { label: "Não", valor: 0 }], id, "escala");
  avancar();

  await D("Tô quase fechando. Pensa no momento exato em que você trava.\n\nQual destas mais parece com o que passa na sua cabeça?");
  const frase = await botoes(FRASES.map(([b, t]) => ({ label: t, valor: b })), id, "empilhado");
  avancar();

  // Resultado
  const r = calcular(escolhas, frase);
  if (!replay.length && window.fbq) fbq("track", "Lead", { content_name: "Diagnóstico dos Sabotadores" });
  let sab = r.primario;

  if (r.empate) {
    await D("Mais de um padrão apareceu com a mesma força em você. Qual destas frases descreve melhor o que te trava agora?");
    sab = await botoes(r.empate.map((b) => ({ label: SAB[b].mentira + " (" + SAB[b].nome + ")", valor: b })), id, "empilhado");
  }

  const apresentar = async (b, abertura) => {
    const s = SAB[b];
    let t = abertura + "\n\n### " + s.nome + "\n> " + s.mentira + "\n\n" + s.pega;
    if (!s.estrutura) t += " No seu caso, com **" + habito + "**, ele aparece " + parada.txt + ".";
    t += "\n\n**Isso soa como você?**";
    await D(t);
    return botoes([{ label: "Sim, sou eu", valor: "sim" }, { label: "Mais ou menos", valor: "meio" }, { label: "Não muito", valor: "nao" }], id, "escala");
  };

  let resp = await apresentar(sab, sab === "R" ? "Deixa eu ser honesto: no seu caso, nenhum Sabotador domina." : "Deixa eu ser honesto: o que te trava tem nome.");

  if (resp !== "sim") {
    const b2 = sab === "R" ? r.ordem[0] : r.planoB;
    if (resp === "meio" && b2 !== sab) {
      await D("Justo. Às vezes ele divide espaço com outro. O segundo que mais apareceu em você foi " + SAB[b2].nome + ":\n\n> " + SAB[b2].mentira + "\n\nQual dos dois parece mais com você?");
      sab = await botoes([sab, b2].map((b) => ({ label: SAB[b].nome, valor: b })), id, "escala");
    } else if (b2 !== sab) {
      resp = await apresentar(b2, b2 === "R"
        ? "Tudo bem. Nenhum outro padrão apareceu forte nas suas respostas. Então pode ser estrutura, e não Sabotador."
        : "Tudo bem. O segundo padrão que mais apareceu nas suas respostas foi outro.");
      if (resp === "nao") {
        await D("Sem problema. Me diz então: qual destas frases mais parece com o que te trava?");
        sab = await botoes(
          ["A", "B", "C", "D", "E", "F", "G"].map((b) => ({ label: SAB[b].mentira + " (" + SAB[b].nome + ")", valor: b }))
            .concat([{ label: "Nenhuma delas", valor: "R" }]),
          id, "empilhado");
      } else sab = b2;
    }
  }

  const s = SAB[sab];

  // Implicação
  let t2 = s.estrutura
    ? "Agora você sabe por onde começar. E o que tem nome tem conserto."
    : "Agora ele tem nome. E o que tem nome se desarma.";
  t2 += "\n\n" + s.protege + " " + s.naoE;
  t2 += s.estrutura
    ? "\n\nEnquanto a estrutura não muda, o hábito para no mesmo ponto: " + parada.txt + ". Foi assim " + vezes.foi + "."
    : "\n\nEnquanto ele não for desarmado, ele volta no mesmo ponto: " + parada.txt + ". Foi assim " + vezes.foi + ".";
  if (circunstancia) t2 += "\n\nE uma coisa importante: você contou que tem algo grande tomando o seu tempo agora. Isso é circunstância, não falha de caráter. Se for o caso, comece ainda menor, ou faça uma pausa com data pra voltar.";
  if (s.cuidado) t2 += "\n\n" + s.cuidado;
  t2 += "\n\n### O seu resultado\n" +
    "- **Hábito:** " + habito + "\n" +
    "- **" + (s.estrutura ? "Resultado" : "Sabotador") + ":** " + s.nome + "\n" +
    (s.estrutura ? "" : "- **Mentira:** " + s.mentira + "\n") +
    "- **Código-chave:** " + s.chave + "\n" +
    "- **Rota:** " + s.rota + "\n" +
    "- **" + (s.estrutura ? "Rodando, vira" : "Desarmado, vira") + ":** " + s.vira + "\n\n" +
    (s.estrutura
      ? "A rota é a ordem dos 3 Códigos que montam a sua estrutura, em 8 semanas."
      : "A rota é a ordem dos 3 Códigos que desarmam o seu Sabotador, em 8 semanas.") +
    "\n\n**Se esse hábito rodasse sozinho, sem depender de motivação, o que mudaria pra você?**";
  await D(t2);
  const mudaria = await texto("Escreva o que mudaria", 220, id);

  // Necessidade (a oferta)
  const t3 =
    "“" + mudaria + "”. Isso é possível, e não depende de você virar outra pessoa.\n\n" +
    "Você já tentou " + vezes.curto + ". Vontade não faltou: você " + largada + ". O que faltou foi um sistema feito " + s.pro + ". Sem ele, toda largada termina no mesmo ponto: " + parada.txt + ".\n\n" +
    "### Os Códigos da Disciplina\n" +
    "É o meu curso, e ele existe pra isso. Lá você recebe a rota completa " + s.do + ", com o que cada Código faz e como aplicar no seu hábito, **" + habito + "**. E a gente monta junto o seu Mapa do Hábito: começa com uma versão mínima de 2 minutos e, a cada duas semanas, entra uma camada nova. Em 8 semanas, você monta o sistema que segura esse hábito nos dias sem vontade.\n\n" +
    "E o que você fez aqui foi a versão rápida. Na aula 2, você faz o diagnóstico completo, com 35 afirmações e o seu plano B.\n\n" +
    "A parte mais difícil você já fez: agora você sabe o que te trava. O próximo passo tá aqui:\n\n[[BOTAO]]\n\nDisciplina > Motivação.";
  await D(t3);
  entradaEl.innerHTML = "";
}

function iniciar() {
  execucao++;
  const id = execucao;
  conversaEl.querySelectorAll(".msg").forEach((n) => n.remove());
  entradaEl.innerHTML = "";
  salvas = [];
  replay = carregar();
  conversa(id).catch((e) => { if (!(e instanceof Cancelado)) console.error(e); });
}

// Sem botão de recomeçar: quem volta à página encontra a conversa onde parou, com a oferta.
// Pra testar do zero, abra a página com ?novo no fim do endereço.
if (/[?&]novo\b/.test(location.search)) {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  history.replaceState(null, "", location.pathname);
}

iniciar();
</script>
